services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: setra
      POSTGRES_PASSWORD: setra
      POSTGRES_DB: setra
    ports:
      - "5432:5432"
    volumes:
      - setra-postgres:/var/lib/postgresql/data
      # Creates the non-superuser application role on first boot so row-level security is enforced in development too.
      - ./packages/database/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setra -d setra"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  setra-postgres:
